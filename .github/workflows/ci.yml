name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test world rules
        run: npm test
      - name: Verify public demo export
        run: |
          npm run build:demo
          git diff --exit-code -- dist
      - name: Check whitespace
        run: git diff --check
