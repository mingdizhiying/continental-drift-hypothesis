name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test world rules
        run: npm test
      - name: Test v0.3.2 Godot reference rules
        run: node --test tools/web-baseline/world.test.js
      - name: Test Godot proxy with local fake provider
        run: node tools/test-godot-proxy.mjs
      - name: Check whitespace
        run: git diff --check
